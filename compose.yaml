services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: testapp
      POSTGRES_USER: testapp
      POSTGRES_PASSWORD: testapp
    ports:
      - "5432:5432"
    volumes:
      - testapp-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testapp -d testapp"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.1-management
    environment:
      RABBITMQ_DEFAULT_USER: testapp
      RABBITMQ_DEFAULT_PASS: testapp
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - testapp-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: bootstrap-admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  migrate:
    image: testapp-api:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=testapp;Username=testapp;Password=testapp;
      Database__ApplyMigrationsOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: testapp-api:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=testapp;Username=testapp;Password=testapp;
      Database__ApplyMigrationsOnStartup: "false"
      Keycloak__Authority: http://keycloak:8080/realms/testapp
      Keycloak__Audience: testapp-api
      RabbitMq__Enabled: "true"
      RabbitMq__ConnectionString: amqp://testapp:testapp@rabbitmq:5672/
      RabbitMq__Exchange: testapp.events
      RabbitMq__RoutingKeyPrefix: testapp
      OTEL_SERVICE_NAME: TestApp.Api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      otel-collector:
        condition: service_started

volumes:
  testapp-postgres:
  testapp-rabbitmq:
