# Конфигурация активного пробера для /health/ready (docs/SLO_ALERTS.md §4, page-правило 1).
#
# Почему отдельный компонент, а не метрика приложения: правило звучит как «/health/ready
# отвечает отказом три проверки подряд». Метрика, которую экспортирует само приложение,
# отвечает на другой вопрос — «приложение считает себя живым». Когда процесс завис, не
# принимает соединения или его не пускает сеть, метрика просто перестаёт обновляться, и
# отличить это от «экспорт метрик отвалился» нечем. Пробер спрашивает снаружи ровно то же,
# что спросил бы балансировщик.
#
# Проба анонимна: /health/live и /health/ready смонтированы через IStartupFilter до
# аутентификации и до лимитера частоты (см. HealthEndpointStartupFilter), поэтому пробер не
# нуждается в токене и не расходует лимит.

modules:
  testapp_ready:
    prober: http
    timeout: 5s
    http:
      method: GET
      # Готовность — это строго 200. Приложение отвечает 503 при Unhealthy и 200 при
      # Degraded (HealthEndpointStartupFilter), поэтому деградация пробу не роняет:
      # частичная деградация — предмет других правил, а не page-алерта о недоступности.
      valid_status_codes: [200]
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
