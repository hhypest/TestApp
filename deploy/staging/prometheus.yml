# Конфигурация Prometheus для staging-контура (issue #16/#19).
#
# Отличается от deploy/prometheus/prometheus.yml ровно одним: блоком alerting в конце. На
# локальном стенде Alertmanager не поднимается, поэтому там его нет — Prometheus не должен
# на каждом цикле логировать недоступный приёмник.
#
# Всё, что выше блока alerting, — дословная копия базового файла. Расхождение означало бы,
# что контур наблюдает не то же, что локальный стенд и CI; совпадение проверяет
# PrometheusConfigTests. Правки вносить в оба файла одним изменением.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: testapp
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Активный пробер готовности (docs/SLO_ALERTS.md §4, page-правило 1). Prometheus ходит в
  # blackbox_exporter, а тот — в API; поэтому адрес цели переезжает в параметр target, а
  # instance сохраняет исходный URL, чтобы алерт называл проверяемый адрес, а не экспортер.
  - job_name: testapp-readiness
    metrics_path: /probe
    params:
      module: [testapp_ready]
    static_configs:
      - targets: ["http://api:8080/health/ready"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
