# Конфигурация Prometheus для staging-контура (issue #16/#19).
#
# Отличается от deploy/prometheus/prometheus.yml ровно одним: блоком alerting в конце. На
# локальном стенде Alertmanager не поднимается, поэтому там его нет — Prometheus не должен
# на каждом цикле логировать недоступный приёмник.
#
# Всё, что выше блока alerting, — дословная копия базового файла. Расхождение означало бы,
# что контур наблюдает не то же, что локальный стенд и CI; совпадение проверяет
# PrometheusConfigTests. Правки вносить в оба файла одним изменением.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: testapp
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
