name: release

# Выпуск по тегу: собирает образ, публикует его в GHCR по immutable digest и создаёт
# GitHub Release со списком доказательств (issue #17, гейт docs/ROADMAP.md §7 пункты 10 и 11).
#
# Перед сборкой workflow требует пять завершённых успешных пайплайнов на том же коммите.
# Сам он тесты не дублирует: проверяет результаты обязательных workflow через GitHub API,
# затем сканирует именно тот образ, который публикует. Порядок — docs/OPERATIONS.md §16.1.
#
# Политика тегов: 1.0.0-rc.N режется из beta-ddd, финальный 1.0.0 — после merge в master.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег для повторного выпуска (например v1.0.0-rc.1)"
        required: true
        type: string
      evidence_only:
        description: "Только пересобрать доказательства у существующего Release (образ не трогать)"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# IMAGE_NAME вычисляется в шаге ниже, а не здесь: ${{ github.repository }} сохраняет регистр
# (hhypest/TestApp), а Docker требует имя репозитория в нижнем регистре — иначе push падает
# с "repository name must be lowercase".

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # При запуске от тега github.sha — это и есть коммит тега, но при ручном запуске с
      # inputs.tag он равен голове ветки, с которой запустили workflow. Дальше сходится всё:
      # и «Коммит» в теле Release, и выборка прогонов по head_sha. Поэтому источник истины —
      # то, что реально выгружено в рабочую директорию.
      - name: Resolve release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          raw="${{ inputs.tag || github.ref_name }}"
          version="${raw#v}"
          if [ "$version" = "$raw" ]; then
            echo "Тег '$raw' не начинается с 'v'. Политика тегов — docs/OPERATIONS.md §16.2." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$raw" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Версия в образе обязана совпадать с тегом, иначе /api/v1/operations/version на контуре
      # будет уверенно называть неверную сборку — это хуже, чем не сообщать версию вовсе.
      - name: Verify tag matches the version source
        run: |
          set -euo pipefail
          prefix="$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)"
          tagged="${{ steps.version.outputs.version }}"
          if [ "${tagged%%-*}" != "$prefix" ]; then
            echo "Тег $tagged не согласуется с VersionPrefix=$prefix в Directory.Build.props." >&2
            echo "Поднимите VersionPrefix в том же change set, что и тег." >&2
            exit 1
          fi

      - name: Verify the exact-commit CI quality gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          RELEASE_EVIDENCE_PATH: artifacts/pipelines.md
        run: node scripts/verify-release-gate.mjs

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build production image
        if: ${{ !inputs.evidence_only }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg VERSION_SUFFIX="$(printf '%s' '${{ steps.version.outputs.version }}' | cut -s -d- -f2-)" \
            --tag "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}" \
            --tag "${{ steps.image.outputs.name }}:release-candidate" \
            .

      # security.yml по-прежнему проверяет production-сборку на каждом коммите, но release
      # собирает собственный артефакт. Сканируем именно его до push: immutable base inputs
      # делают сборку воспроизводимой, но не заменяют проверку итоговых app layers.
      - name: Scan the exact release image for high and critical vulnerabilities
        if: ${{ !inputs.evidence_only }}
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e
          image
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"

      - name: Push image and capture immutable digest
        id: push
        if: ${{ !inputs.evidence_only }}
        run: |
          set -euo pipefail
          docker push "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "reference=$digest" >> "$GITHUB_OUTPUT"

      # Пересборка ради обновления доказательств дала бы образу новый digest, и Release
      # начал бы называть не то, что развёрнуто. Поэтому в режиме evidence_only образ не
      # собирается, а digest читается у уже опубликованного.
      - name: Resolve digest of the already published image
        id: existing
        if: ${{ inputs.evidence_only }}
        run: |
          set -euo pipefail
          reference="${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"
          docker pull --quiet "$reference"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$reference")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "reference=$digest" >> "$GITHUB_OUTPUT"

      # Тот же шаг, что в workflow security, но артефакт прикладывается к Release, а не к прогону:
      # доказательство должно жить столько же, сколько релиз.
      - name: Generate CycloneDX image SBOM
        if: ${{ !inputs.evidence_only }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/artifacts:/out" \
            aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
            image \
            --format cyclonedx \
            --output /out/testapp-api.cdx.json \
            "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"
          test -s artifacts/testapp-api.cdx.json

      - name: Attach the frozen v1 contract
        if: ${{ !inputs.evidence_only }}
        run: cp docs/openapi/v1.json artifacts/openapi-v1.json

      # Образ прикладывается к Release так же, как SBOM: GHCR может стать недоступен, пакет —
      # приватным, а машина, на которую разворачивают, — отрезанной от интернета. Архив
      # загружается `docker load` и не требует реестра вовсе.
      #
      # Проверяемость даёт SHA-256 самого файла, а не digest манифеста: docker save/load
      # сохраняет содержимое образа, но RepoDigest после загрузки может отсутствовать —
      # он присваивается реестром, а не архивом. Поэтому канонической ссылкой остаётся digest
      # в GHCR, а архив сверяется по контрольной сумме, записанной здесь же.
      - name: Export the published image as a loadable archive
        id: archive
        run: |
          set -euo pipefail
          mkdir -p artifacts
          file="testapp-api-${{ steps.version.outputs.version }}.image.tar.gz"
          docker save "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}" | gzip > "artifacts/$file"
          test -s "artifacts/$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "artifacts/$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "artifacts/$file" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Write evidence list
        run: |
          set -euo pipefail
          cat > artifacts/EVIDENCE.md <<EOF
          # Доказательства выпуска ${{ steps.version.outputs.tag }}

          | Что | Значение |
          |---|---|
          | Коммит | \`${{ steps.commit.outputs.sha }}\` |
          | Образ | \`${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}\` |
          | Digest | \`${{ steps.push.outputs.digest || steps.existing.outputs.digest }}\` |
          | Развернуть по digest | \`${{ steps.push.outputs.reference || steps.existing.outputs.reference }}\` |
          | Архив образа | \`${{ steps.archive.outputs.file }}\` (${{ steps.archive.outputs.size }}) |
          | SHA-256 архива | \`${{ steps.archive.outputs.sha256 }}\` |

          Разворачивать следует **по digest, а не по тегу**: тег перемещаем, digest — нет.
          Развёртывание обязано пробросить digest в переменную \`TESTAPP_IMAGE_DIGEST\`,
          тогда \`GET /api/v1/operations/version\` отвечает, что именно запущено.

          ## Приложено

          - \`${{ steps.archive.outputs.file }}\` — сам образ, загружаемый без реестра;
          - \`testapp-api.cdx.json\` — SBOM образа в формате CycloneDX;
          - \`openapi-v1.json\` — замороженный контракт v1 на момент выпуска.

          ## Установка без доступа к GHCR

          \`\`\`bash
          sha256sum -c <<< "${{ steps.archive.outputs.sha256 }}  ${{ steps.archive.outputs.file }}"
          docker load -i ${{ steps.archive.outputs.file }}
          \`\`\`

          После загрузки образ доступен под тегом \`${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}\`,
          но **без** digest: RepoDigest присваивает реестр, а не архив. Поэтому на отрезанной
          машине \`TESTAPP_IMAGE\` задаётся тегом, а не ссылкой \`@sha256:\`. Проверкой
          подлинности в этом случае служит контрольная сумма архива, сверенная выше, а
          \`TESTAPP_IMAGE_DIGEST\` всё равно выставляется в digest из таблицы: он определяет,
          какая сборка запущена, и попадает в ответ \`GET /api/v1/operations/version\`.

          ## Пайплайны на этом коммите

          Гейт §7 пункт 7 требует зелёные пайплайны на релизном коммите. Тег сам по себе
          запускает только \`dotnet\` и \`security\`; \`observability\`, \`performance\` и
          \`postman\` ограничены paths-фильтром и запускаются вручную — порядок описан в
          docs/OPERATIONS.md §16.1.

          | Пайплайн | Run ID | Событие | Статус |
          |---|---|---|---|
          EOF
          cat artifacts/pipelines.md >> artifacts/EVIDENCE.md
          cat >> artifacts/EVIDENCE.md <<'EOF'

          Таблица собрана из API по `head_sha` этого коммита до сборки образа. Для каждого
          workflow выбран последний завершённый прогон; отсутствие или заключение, отличное
          от `success`, останавливает выпуск. Обновить доказательства можно повторным запуском
          `release` с `evidence_only` — образ при этом не пересобирается.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          # В режиме evidence_only собирается только архив образа — SBOM и контракт уже
          # приложены и относятся к тому же digest, пересобирать их незачем.
          assets=("artifacts/${{ steps.archive.outputs.file }}")
          for optional in artifacts/testapp-api.cdx.json artifacts/openapi-v1.json; do
            if [ -f "$optional" ]; then
              assets+=("$optional")
            fi
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file artifacts/EVIDENCE.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file artifacts/EVIDENCE.md \
              ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
              "${assets[@]}"
          fi
