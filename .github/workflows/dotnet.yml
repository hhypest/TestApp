name: dotnet
on:
  workflow_dispatch:
  push:
    branches:
      - beta-ddd
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - beta-ddd
      - master
jobs:
  build-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_DB: testapp
          POSTGRES_USER: testapp
          POSTGRES_PASSWORD: testapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testapp -d testapp"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:4.3.1-management@sha256:8734b9e9cd03d12b2e1d973415fc4c5c941c5eca351b4bd63f721782b1bf7c8b
        env:
          RABBITMQ_DEFAULT_USER: testapp
          RABBITMQ_DEFAULT_PASS: testapp
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TESTAPP_POSTGRES_ADMIN: Host=127.0.0.1;Port=5432;Username=testapp;Password=testapp;Database=postgres;
      ConnectionStrings__Database: Host=127.0.0.1;Port=5432;Database=testapp;Username=testapp;Password=testapp;
      TESTAPP_RABBITMQ: amqp://testapp:testapp@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.400'
      - run: dotnet restore TestApp.slnx
      - name: Audit high and critical NuGet vulnerabilities
        run: >-
          dotnet restore TestApp.slnx
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=high
          -warnaserror:NU1903,NU1904
      - run: dotnet build TestApp.slnx --no-restore --configuration Release
      - run: dotnet tool restore
      - name: Verify EF Core model matches migrations
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/TestApp.Infrastructure/TestApp.Infrastructure.csproj
          --startup-project src/TestApp.Infrastructure/TestApp.Infrastructure.csproj
          --context AppDbContext
          --configuration Release
          --no-build
      - name: Verify release tooling and staging seed
        run: |
          python3 scripts/verify_coverage_test.py
          python3 scripts/verify_immutable_references_test.py
          python3 scripts/verify_immutable_references.py
          node --test scripts/sanitize-k6-summary.test.mjs
          node --check scripts/sanitize-k6-summary.mjs
          node --test performance/k6/seed-plan.test.mjs
          node --check performance/k6/seed-data.js
          bash -n scripts/seed-staging.sh
          env \
            BASE_URL=https://staging.example.invalid \
            KEYCLOAK_URL=https://staging.example.invalid/auth \
            KEYCLOAK_REALM=testapp-staging \
            TESTAPP_KEYCLOAK_CLIENT_SECRET=validation-only \
            KEYCLOAK_ADMIN_USER=validator \
            KEYCLOAK_ADMIN_PASSWORD=validation-only \
            AUTHOR_USERNAME=author \
            AUTHOR_PASSWORD=validation-only \
            ADMIN_USERNAME=admin \
            ADMIN_PASSWORD=validation-only \
            SEED_STUDENT_PASSWORD=validation-only \
            bash scripts/seed-staging.sh --check
          node --test scripts/verify-release-gate.test.mjs
          node --check scripts/verify-release-gate.mjs
      - name: Run tests and collect exact-head coverage
        run: >-
          dotnet test TestApp.slnx
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results
      - name: Enforce exact-head line coverage floor
        run: >-
          python3 scripts/verify_coverage.py
          --reports artifacts/test-results
          --minimum-line-rate 90
      - name: Upload exact-head coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-head-coverage
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 30
      - name: Validate compose configuration
        run: |
          docker compose -f compose.yaml config --quiet
          bash scripts/validate-staging-compose.sh
      - name: Build production API image
        run: docker build --tag testapp-api:ci .
      # Задание миграций проверяется целиком, а не одним успешным прогоном: применение на
      # чистой базе, идемпотентность повторного прогона и отказ автоприменения на старте вне
      # Development. Порядок и обоснование — scripts/verify-migration-job.sh (issue #21 пункт 4).
      - name: Verify the migration job from the production image
        env:
          IMAGE: testapp-api:ci
          CONNECTION_STRING: ${{ env.ConnectionStrings__Database }}
        run: bash scripts/verify-migration-job.sh
      - name: Seed backup restore probe
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=testapp \
            postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941 \
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=testapp \
              --dbname=testapp \
              --set=ON_ERROR_STOP=1 \
              --command="INSERT INTO idempotency_records (\"Id\", \"Operation\", \"ActorId\", \"RequestId\", \"ResultType\", \"ResultJson\", \"CreatedAt\", \"RequestFingerprint\") VALUES ('00000000-0000-0000-0000-000000000101', 'ci.backup.restore', 'ci', '00000000-0000-0000-0000-000000000102', 'System.String', '\"probe\"', CURRENT_TIMESTAMP, repeat('0', 64));"
      - name: Create and verify PostgreSQL backup
        env:
          POSTGRES_PASSWORD: testapp
          POSTGRES_ADMIN_PASSWORD: testapp
          VERIFY_QUERY: SELECT COUNT(*) FROM idempotency_records WHERE "Operation" = 'ci.backup.restore';
          VERIFY_EXPECTED: '1'
        run: |
          bash scripts/postgresql-backup.sh /tmp/testapp-ci.dump
          POSTGRES_SOURCE_DATABASE=testapp \
            bash scripts/postgresql-restore-verify.sh /tmp/testapp-ci.dump testapp_restore_verify
