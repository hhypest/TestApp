name: dotnet
on:
  push:
    branches:
      - beta-ddd
  pull_request:
    branches:
      - beta-ddd
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testapp
          MARIADB_USER: testapp
          MARIADB_PASSWORD: testapp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:4.3.1-management
        env:
          RABBITMQ_DEFAULT_USER: testapp
          RABBITMQ_DEFAULT_PASS: testapp
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TESTAPP_MARIADB_ROOT: Server=127.0.0.1;Port=3306;User=root;Password=root;
      ConnectionStrings__Database: Server=127.0.0.1;Port=3306;Database=testapp;User=testapp;Password=testapp;
      TESTAPP_RABBITMQ: amqp://testapp:testapp@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TestApp.slnx
      - name: Audit high and critical NuGet vulnerabilities
        run: >-
          dotnet restore TestApp.slnx
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=high
          -warnaserror:NU1903,NU1904
      - run: dotnet build TestApp.slnx --no-restore --configuration Release
      - run: dotnet test TestApp.slnx --no-build --configuration Release
      - name: Validate compose configuration
        run: docker compose -f compose.yaml config --quiet
      - name: Build production API image
        run: docker build --tag testapp-api:ci .
      - name: Apply migrations from production image
        run: >-
          docker run --rm --network host
          -e ASPNETCORE_ENVIRONMENT=Production
          -e 'ConnectionStrings__Database=${{ env.ConnectionStrings__Database }}'
          -e Database__ApplyMigrationsOnStartup=false
          -e Keycloak__Authority=http://127.0.0.1:8081/realms/testapp
          -e Keycloak__Audience=testapp-api
          testapp-api:ci --migrate
