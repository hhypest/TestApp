name: observability

on:
  workflow_dispatch:
  push:
    branches:
      - beta-ddd
      - master
    # Тег не запускает этот workflow: paths-фильтр применяется и к push тега,
    # а релизный коммит меняет только CHANGELOG.md. Прогон на голове тега
    # берётся через workflow_dispatch — см. docs/OPERATIONS.md, «Сбор доказательств CI».
    paths:
      - "deploy/otel-collector-config.yaml"
      - "deploy/prometheus/**"
      - "deploy/blackbox/**"
      - "deploy/alertmanager/**"
      - "deploy/grafana/**"
      - "deploy/staging/**"
      - "src/TestApp.Infrastructure/Observability/**"
      - "compose.yaml"
      - "compose.staging.yaml"
      - ".env.staging.example"
      - "scripts/validate-observability-stack.sh"
      - "scripts/validate-staging-compose.sh"
      - ".github/workflows/observability.yml"
  pull_request:
    branches:
      - beta-ddd
      - master
    paths:
      - "deploy/otel-collector-config.yaml"
      - "deploy/prometheus/**"
      - "deploy/blackbox/**"
      - "deploy/alertmanager/**"
      - "deploy/grafana/**"
      - "deploy/staging/**"
      - "src/TestApp.Infrastructure/Observability/**"
      - "compose.yaml"
      - "compose.staging.yaml"
      - ".env.staging.example"
      - "scripts/validate-observability-stack.sh"
      - "scripts/validate-staging-compose.sh"
      - ".github/workflows/observability.yml"

permissions:
  contents: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate compose configuration
        run: |
          docker compose -f compose.yaml config --quiet
          bash scripts/validate-staging-compose.sh

      - name: Build and start full stack
        run: docker compose -f compose.yaml up -d --build

      - name: Wait for Keycloak and API readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8081/realms/testapp/.well-known/openid-configuration >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Keycloak did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8080/health/ready >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "API did not become ready" >&2
              docker compose -f compose.yaml logs api
              exit 1
            fi
            sleep 2
          done

      - name: Generate a little request traffic
        run: |
          set -euo pipefail
          for i in $(seq 1 5); do
            curl --fail --silent --show-error http://localhost:8080/health/ready >/dev/null
            curl --fail --silent --show-error http://localhost:8080/health/live >/dev/null
          done

      - name: Validate Prometheus/Grafana observability stack
        env:
          TIMEOUT_SECONDS: "180"
        run: bash scripts/validate-observability-stack.sh

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color --tail=1000

      - name: Stop stack
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans
