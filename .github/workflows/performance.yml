name: performance

on:
  workflow_dispatch:
  push:
    branches:
      - beta-ddd
      - master
    # Тег не запускает этот workflow: paths-фильтр применяется и к push тега,
    # а релизный коммит меняет только CHANGELOG.md. Прогон на голове тега
    # берётся через workflow_dispatch — см. docs/OPERATIONS.md, «Сбор доказательств CI».
    paths:
      - "src/**"
      - "performance/**"
      - "deploy/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/performance.yml"
  pull_request:
    branches:
      - beta-ddd
      - master
    paths:
      - "src/**"
      - "performance/**"
      - "deploy/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/performance.yml"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capacity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and start production-shaped stack
        run: >-
          docker compose
          -f compose.yaml
          -f performance/compose.performance.yaml
          up -d --build api

      - name: Wait for Keycloak and API readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8081/realms/testapp/.well-known/openid-configuration >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Keycloak did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8080/health/ready >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "API did not become ready" >&2
              docker compose -f compose.yaml -f performance/compose.performance.yaml logs api
              exit 1
            fi
            sleep 2
          done

      - name: Run authenticated API capacity scenarios
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance
          chmod 0777 artifacts/performance
          docker run --rm --network host \
            -e BASE_URL=http://localhost:8080 \
            -e KEYCLOAK_URL=http://localhost:8081 \
            -e KEYCLOAK_CLIENT_ID=testapp-api \
            -v "$PWD/performance/k6:/scripts:ro" \
            -v "$PWD/artifacts/performance:/results" \
            grafana/k6:0.54.0 \
            run --summary-export=/results/k6-summary.json /scripts/api-capacity.js

      - name: Verify expiration storm drain
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance
          DB_CONTAINER=$(docker compose -f compose.yaml -f performance/compose.performance.yaml ps -q postgres)
          docker exec -i "$DB_CONTAINER" psql -U testapp -d testapp -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE test_attempts
          SET "DeadlineAt" = CURRENT_TIMESTAMP - INTERVAL '1 minute'
          WHERE "Status" = 1;
          SQL

          INITIAL=$(docker exec "$DB_CONTAINER" psql -U testapp -d testapp -Atqc \
            'SELECT COUNT(*) FROM test_attempts WHERE "Status" = 1 AND "DeadlineAt" < CURRENT_TIMESTAMP;')
          if [ "$INITIAL" -lt 1 ]; then
            echo "Capacity run did not leave any in-progress attempts for expiration probe" >&2
            exit 1
          fi

          START=$(date +%s)
          REMAINING="$INITIAL"
          for attempt in $(seq 1 30); do
            REMAINING=$(docker exec "$DB_CONTAINER" psql -U testapp -d testapp -Atqc \
              'SELECT COUNT(*) FROM test_attempts WHERE "Status" = 1 AND "DeadlineAt" < CURRENT_TIMESTAMP;')
            if [ "$REMAINING" -eq 0 ]; then
              break
            fi
            sleep 1
          done
          ELAPSED=$(( $(date +%s) - START ))

          if [ "$REMAINING" -ne 0 ]; then
            echo "Expiration backlog did not drain within 30 seconds: remaining=$REMAINING" >&2
            exit 1
          fi

          printf '{"initialOverdue":%s,"remainingOverdue":%s,"drainSeconds":%s}\n' \
            "$INITIAL" "$REMAINING" "$ELAPSED" > artifacts/performance/expiration.json

      - name: Verify Outbox backlog recovery through RabbitMQ
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance
          DB_CONTAINER=$(docker compose -f compose.yaml -f performance/compose.performance.yaml ps -q postgres)
          printf '{"status":"topology-setup"}\n' > artifacts/performance/outbox.json

          RABBIT_NODE=$(curl --fail-with-body --silent --show-error -u testapp:testapp \
            http://localhost:15672/api/overview | jq -r '.node')
          if [ -z "$RABBIT_NODE" ] || [ "$RABBIT_NODE" = "null" ]; then
            echo "RabbitMQ management API did not return a node name" >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error -u testapp:testapp \
            http://localhost:15672/api/exchanges/%2F/testapp.events >/dev/null
          QUEUE_DEFINITION=$(jq -nc --arg node "$RABBIT_NODE" \
            '{durable:true,auto_delete:false,arguments:{},node:$node}')
          curl --fail-with-body --silent --show-error -u testapp:testapp \
            -H 'content-type: application/json' \
            -X PUT http://localhost:15672/api/queues/%2F/capacity-probe \
            -d "$QUEUE_DEFINITION" >/dev/null
          curl --fail-with-body --silent --show-error -u testapp:testapp \
            -H 'content-type: application/json' \
            -X POST http://localhost:15672/api/bindings/%2F/e/testapp.events/q/capacity-probe \
            -d '{"routing_key":"testapp.#","arguments":{}}' >/dev/null

          PREEXISTING_PENDING=$(docker exec "$DB_CONTAINER" psql -U testapp -d testapp -Atqc \
            'SELECT COUNT(*) FROM outbox_messages WHERE "ProcessedAt" IS NULL AND "DeadLetteredAt" IS NULL AND "DiscardedAt" IS NULL;')

          docker exec -i "$DB_CONTAINER" psql -U testapp -d testapp -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO outbox_messages
              ("Id", "OccurredAt", "Type", "Payload", "ProcessedAt", "Error", "AttemptCount", "LastAttemptAt", "NextAttemptAt", "DeadLetteredAt", "DiscardedAt")
          SELECT gen_random_uuid(), CURRENT_TIMESTAMP, 'CapacityProbe', '{"probe":true}', NULL, NULL, 0, NULL, NULL, NULL, NULL
          FROM generate_series(1, 100);
          SQL

          INITIAL=$(docker exec "$DB_CONTAINER" psql -U testapp -d testapp -Atqc \
            "SELECT COUNT(*) FROM outbox_messages WHERE \"Type\" = 'CapacityProbe' AND \"ProcessedAt\" IS NULL;")
          if [ "$INITIAL" -ne 100 ]; then
            echo "Expected 100 synthetic Outbox messages, found $INITIAL" >&2
            exit 1
          fi

          printf '{"preexistingPending":%s,"initialOutbox":%s,"remainingOutbox":%s,"totalPending":%s,"drainSeconds":0}\n' \
            "$PREEXISTING_PENDING" "$INITIAL" "$INITIAL" "$((PREEXISTING_PENDING + INITIAL))" \
            > artifacts/performance/outbox.json

          START=$(date +%s)
          REMAINING="$INITIAL"
          for attempt in $(seq 1 30); do
            REMAINING=$(docker exec "$DB_CONTAINER" psql -U testapp -d testapp -Atqc \
              "SELECT COUNT(*) FROM outbox_messages WHERE \"Type\" = 'CapacityProbe' AND \"ProcessedAt\" IS NULL;")
            if [ "$REMAINING" -eq 0 ]; then
              break
            fi
            sleep 1
          done
          ELAPSED=$(( $(date +%s) - START ))
          TOTAL_PENDING=$(docker exec "$DB_CONTAINER" psql -U testapp -d testapp -Atqc \
            'SELECT COUNT(*) FROM outbox_messages WHERE "ProcessedAt" IS NULL AND "DeadLetteredAt" IS NULL AND "DiscardedAt" IS NULL;')

          printf '{"preexistingPending":%s,"initialOutbox":%s,"remainingOutbox":%s,"totalPending":%s,"drainSeconds":%s}\n' \
            "$PREEXISTING_PENDING" "$INITIAL" "$REMAINING" "$TOTAL_PENDING" "$ELAPSED" \
            > artifacts/performance/outbox.json

          if [ "$REMAINING" -ne 0 ]; then
            echo "Outbox backlog did not drain within 30 seconds: probe_remaining=$REMAINING total_pending=$TOTAL_PENDING" >&2
            docker exec "$DB_CONTAINER" psql -U testapp -d testapp -P pager=off -c \
              'SELECT "Type", COUNT(*) AS pending, MIN("OccurredAt") AS oldest FROM outbox_messages WHERE "ProcessedAt" IS NULL AND "DeadLetteredAt" IS NULL AND "DiscardedAt" IS NULL GROUP BY "Type" ORDER BY oldest;'
            docker compose -f compose.yaml -f performance/compose.performance.yaml logs --no-color --tail=500 api
            exit 1
          fi

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testapp-capacity-results
          path: artifacts/performance
          if-no-files-found: warn
          retention-days: 30

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f performance/compose.performance.yaml logs --no-color --tail=1000

      - name: Stop performance stack
        if: always()
        run: docker compose -f compose.yaml -f performance/compose.performance.yaml down -v --remove-orphans
