# Staging-контур гейта 1.0 (issue #16, ADR-031).
#
# Это НЕ вариант compose.yaml с другими портами. Локальный compose поднимает
# Development-профиль с отладочными креденшелами; здесь профиль production, а все секреты
# приходят из .env, который лежит на самой машине и никогда не коммитится.
#
#   docker compose -f compose.staging.yaml --env-file .env up -d
#
# Образ задаётся ТОЛЬКО digest'ом (TESTAPP_IMAGE), а не тегом: тег перемещаем, digest — нет.
# Тот же digest пробрасывается в TESTAPP_IMAGE_DIGEST, поэтому GET /api/v1/operations/version
# отвечает, что именно запущено. Порядок выпуска — docs/OPERATIONS.md §16.2.
#
# Наружу опубликован один порт — ingress. Всё остальное живёт во внутренней сети: PostgreSQL,
# RabbitMQ, Prometheus и Grafana не должны быть доступны из интернета, а на локальном стенде
# они публикуются именно потому, что он локальный.

name: testapp-staging

services:
  ingress:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    # Порты на хосте можно переназначить, если 80 и 443 заняты — например реле Docker
    # Desktop или изъятым диапазоном Hyper-V. Внутри контейнера Caddy всегда слушает 80 и 443,
    # и снаружи контур обязан быть доступен на них же: HTTP-01 у Let's Encrypt ходит строго
    # в 80-й, а TLS-ALPN-01 — строго в 443-й, порт в них не настраивается. Переназначение —
    # это про сторону хоста, а роутер пробрасывает 80 -> TESTAPP_HTTP_PORT и 443 -> HTTPS.
    ports:
      - "${TESTAPP_HTTP_PORT:-80}:80"
      - "${TESTAPP_HTTPS_PORT:-443}:443"
    environment:
      TESTAPP_PUBLIC_HOST: ${TESTAPP_PUBLIC_HOST:?нужен публичный домен контура}
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - testapp-staging-caddy-data:/data
      - testapp-staging-caddy-config:/config
    # Публичное имя обязано разрешаться в ingress и изнутри сети compose. API ходит к
    # Keycloak по адресу https://${TESTAPP_PUBLIC_HOST}/auth — это тот же issuer, что в
    # токене, и подменить его внутренним адресом нельзя: валидация JWT сверяет issuer
    # буквально. Без алиаса запрос ушёл бы в публичный DNS и вернулся на внешний адрес
    # машины, а hairpin NAT на большинстве роутеров и в WSL2 не работает — API не смог бы
    # получить метаданные OIDC, и контур выглядел бы поднятым, но не пускал бы никого.
    networks:
      default:
        aliases:
          - ${TESTAPP_PUBLIC_HOST}
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_DB: ${KEYCLOAK_DB:?}
    volumes:
      - testapp-staging-postgres:/var/lib/postgresql
      # Выполняется один раз при инициализации пустого тома: заводит отдельную базу
      # для Keycloak. Без неё Keycloak падает на старте.
      - ./deploy/staging/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.1-management@sha256:8734b9e9cd03d12b2e1d973415fc4c5c941c5eca351b4bd63f721782b1bf7c8b
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - testapp-staging-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    restart: unless-stopped
    # Не start-dev: на контуре нужен production-режим Keycloak, иначе проверяется
    # не та конфигурация, которая поедет дальше.
    #
    # Без --optimized намеренно: этот флаг означает «образ уже аугментирован через kc.sh build»,
    # а KC_DB, KC_HEALTH_ENABLED и KC_METRICS_ENABLED — build-time опции, заданные здесь в
    # runtime. Со стоковым образом quay.io/keycloak/keycloak такой старт падает. Плата за
    # корректность — несколько десятков секунд авто-сборки при каждом старте контейнера;
    # если это станет мешать, правильный путь — свой образ с выполненным kc.sh build,
    # а не возврат флага.
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: https://${TESTAPP_PUBLIC_HOST}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:?}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Подставляются Keycloak при импорте realm через синтаксис $(env:VAR).
      TESTAPP_KEYCLOAK_CLIENT_SECRET: ${TESTAPP_KEYCLOAK_CLIENT_SECRET:?}
      TESTAPP_PUBLIC_HOST: ${TESTAPP_PUBLIC_HOST}
    volumes:
      - ./deploy/staging/testapp-staging-realm.json:/opt/keycloak/data/import/testapp-staging-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

  # Активный пробер готовности (docs/SLO_ALERTS.md §4, page-правило 1, ADR-034). На контуре
  # он нужнее, чем локально: именно здесь page-алерт должен доехать до дежурного.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./deploy/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  prometheus:
    image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # История нужна дольше одного drill: пороги в #19 калибруются по наблюдениям,
      # а не по одному прогону.
      - "--storage.tsdb.retention.time=30d"
    volumes:
      # Конфиг контура: тот же, что локальный, плюс блок alerting.
      - ./deploy/staging/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Правила и цель внешней пробы — только на контуре, ingress есть только здесь.
      - ./deploy/staging/alerts-ingress.yml:/etc/prometheus/alerts-ingress.yml:ro
      - ./deploy/staging/targets:/etc/prometheus/targets:ro
      - testapp-staging-prometheus:/prometheus
    depends_on:
      otel-collector:
        condition: service_started
      alertmanager:
        condition: service_started
      blackbox-exporter:
        condition: service_started

  # Закрывает худший из открытых сценариев: авария, о которой никто не узнал. Правила
  # алертов существовали и раньше, но срабатывали только в UI Prometheus.
  # Полный объём issue #19 (три drill'а с измеренным time-to-alert и перекалибровкой
  # порогов) этим НЕ закрыт — закрыта только доставка.
  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # URL webhook'а — секрет: создаётся оператором на машине, лежит в .gitignore.
      # Без файла Alertmanager не стартует, и это правильно: молчащий приёмник хуже,
      # чем явный отказ (та же логика, что в ADR-014 про no-op publisher).
      - ./deploy/staging/webhook-url:/etc/alertmanager/webhook-url:ro
      - testapp-staging-alertmanager:/alertmanager

  grafana:
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${TESTAPP_PUBLIC_HOST}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/testapp-dashboards:ro
      - testapp-staging-grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  # Миграции — отдельный одноразовый прогон тем же образом. Вне Development код запрещает
  # startup-миграции (RuntimeConfiguration.Database.cs), поэтому иначе API просто не поднимется.
  migrate:
    image: ${TESTAPP_IMAGE:?нужен digest образа, например ghcr.io/hhypest/testapp@sha256:...}
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      Database__ApplyMigrationsOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${TESTAPP_IMAGE:?}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_HTTP_PORTS: 8080

      # Отвечает на вопрос «что именно развёрнуто» через /api/v1/operations/version.
      TESTAPP_IMAGE_DIGEST: ${TESTAPP_IMAGE_DIGEST:?}

      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      Database__ApplyMigrationsOnStartup: "false"

      Keycloak__Authority: https://${TESTAPP_PUBLIC_HOST}/auth/realms/testapp-staging
      Keycloak__Audience: testapp-api
      Keycloak__RequireHttpsMetadata: "true"

      RabbitMq__Enabled: "true"
      RabbitMq__ConnectionString: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RabbitMq__Exchange: testapp.events
      RabbitMq__RoutingKeyPrefix: testapp

      # TLS терминируется на ingress — код поддерживает это явно, поэтому редирект выключен,
      # а HSTS включён: заголовок ставит приложение, соединение шифрует Caddy.
      TransportSecurity__HttpsRedirectionEnabled: "false"
      TransportSecurity__HstsEnabled: "true"
      TransportSecurity__HstsMaxAgeDays: "30"
      TransportSecurity__HstsIncludeSubDomains: "false"
      TransportSecurity__HstsPreload: "false"
      TransportSecurity__SecurityHeadersEnabled: "true"

      # КРИТИЧНО для issue #20 и #19. Лимит частоты ключуется по claim `sub`, а для анонимных
      # запросов — по RemoteIpAddress (RateLimitPartitioning.cs). Если не объявить доверенную
      # сеть, ForwardedHeaders отбросит X-Forwarded-For, весь анонимный трафик схлопнется в одну
      # партицию по адресу ingress, и нагрузочный прогон упрётся в 429, не имеющие отношения
      # к ёмкости. Цифры из такого прогона попадут в PERFORMANCE.md как baseline, а по ним
      # откалибруются пороги алертов — обе ошибки будут выглядеть как настоящие измерения.
      ReverseProxy__Enabled: "true"
      # ForwardLimit равен числу узлов, ТЕРМИНИРУЮЩИХ соединение перед приложением. Проброс
      # портов в него не входит: NAT подменяет адрес назначения, но соединение не терминирует
      # и X-Forwarded-For не добавляет. Двойка нужна там, где перед ingress стоит обратный
      # прокси или облако провайдера. Ошибка в любую сторону даёт один и тот же результат —
      # за клиента принимается не тот адрес. Вторая доверенная сеть объявляет этот узел; по
      # умолчанию loopback, то есть «его нет»: пустое значение уронило бы разбор CIDR.
      ReverseProxy__ForwardLimit: ${TESTAPP_FORWARD_LIMIT:-1}
      ReverseProxy__KnownNetworks__0: ${TESTAPP_INTERNAL_CIDR:?CIDR внутренней сети compose}
      ReverseProxy__KnownNetworks__1: ${TESTAPP_UPSTREAM_PROXY_CIDR:-127.0.0.1/32}

      # Явный список источников; wildcard код запрещает.
      Cors__Enabled: ${CORS_ENABLED:-false}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-}
      Cors__AllowCredentials: "false"

      # На контуре спецификация закрыта ролью администратора, а не анонимна.
      OpenApi__Enabled: "true"
      OpenApi__AllowAnonymous: "false"

      OTEL_SERVICE_NAME: TestApp.Api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=staging
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      otel-collector:
        condition: service_started

volumes:
  testapp-staging-postgres:
  testapp-staging-rabbitmq:
  testapp-staging-prometheus:
  testapp-staging-alertmanager:
  testapp-staging-grafana:
  testapp-staging-caddy-data:
  testapp-staging-caddy-config:
